<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shoot & Edit Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shoot & Edit Log">
<meta name="theme-color" content="#1c1a17">
</head>
<body>
<div id="root"></div>
<style>
  :root {
    --ink: #1c1a17;
    --paper: #f7f4ee;
    --tape: #ABB1FF;
    --tape-dim: #e8e9ff;
    --line: #d9d3c7;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    --serif: 'Lora', Georgia, 'Times New Roman', serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  #root {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    padding: 28px 20px 40px;
    max-width: 560px;
    margin: 0 auto;
  }
  .slate {
    border: 2px solid var(--ink);
    border-radius: 4px;
    padding: 18px 20px;
    margin-bottom: 22px;
    position: relative;
    background:
      repeating-linear-gradient(135deg, var(--ink) 0 14px, transparent 14px 28px) top left / 100% 10px no-repeat,
      var(--paper);
  }
  .slate-top {
    height: 10px;
    margin: -18px -20px 14px;
    background: repeating-linear-gradient(135deg, var(--ink) 0 14px, var(--paper) 14px 28px);
    border-bottom: 2px solid var(--ink);
  }
  .slate h1 {
    font-family: var(--mono);
    font-size: 23px;
    letter-spacing: 1px;
    margin: 0 0 4px;
    text-transform: uppercase;
  }
  .slate p {
    font-family: var(--mono);
    font-size: 14px;
    color: #6b655a;
    margin: 0;
  }
  .toolbar-row {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 22px;
  }
  .import-toggle {
    width: 100%;
    font-family: var(--mono);
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 16px;
    border: 2px solid var(--ink);
    border-radius: 4px;
    background: var(--tape-dim);
    color: var(--ink);
    cursor: pointer;
    text-align: center;
  }
  .import-toggle:hover { background: var(--tape); color: #fff; border-color: var(--tape); }
  .new-timecard-btn {
    width: 100%;
    font-family: var(--mono);
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 16px;
    border: 2px solid #a3392f;
    border-radius: 4px;
    background: none;
    color: #a3392f;
    cursor: pointer;
    text-align: center;
  }
  .new-timecard-btn:hover { background: #a3392f; color: #fff; }
  .import-panel {
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #fff;
    padding: 14px 16px;
    margin-bottom: 20px;
  }
  .import-hint {
    font-family: var(--mono);
    font-size: 12px;
    color: #8a8375;
    margin-bottom: 8px;
    line-height: 1.5;
  }
  .import-panel textarea {
    width: 100%;
    font-family: var(--mono);
    font-size: 14px;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--paper);
    resize: vertical;
    min-height: 120px;
  }
  .import-actions {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }
  .import-btn {
    font-family: var(--mono);
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 10px 16px;
    border: 2px solid var(--ink);
    border-radius: 4px;
    background: var(--ink);
    color: #fff;
    cursor: pointer;
  }
  .import-btn:hover { background: #34302a; }
  .import-msg {
    font-family: var(--mono);
    font-size: 13px;
    margin-top: 8px;
  }
  .import-msg.error { color: #a3392f; }
  .import-msg.success { color: #3d7a4d; }

  .invoice-meta-row {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }
  .invoice-meta-row .project-field { flex: 1; }
  .project-row {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 20px;
  }
  .project-field { flex: 1; min-width: 120px; }
  .project-field label {
    display: block;
    font-family: var(--mono);
    font-size: 12px;
    color: #8a8375;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .project-field input {
    width: 100%;
    font-family: var(--serif);
    font-size: 17px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: #fff;
  }
  .project-field input[type="date"] {
    font-family: var(--mono);
    font-size: 15px;
  }
  .project-field input[type="number"] {
    font-family: var(--mono);
    font-size: 16px;
    text-align: center;
    border: 2px solid var(--ink);
    color: var(--ink);
  }
  .section-hr {
    border: none;
    border-top: 2px solid var(--ink);
    margin: 22px 0 16px;
  }
  .section-label {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink);
    margin-bottom: 12px;
  }

  .rate-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    align-items: stretch;
  }
  .rate-btn {
    flex: 1;
    font-family: var(--mono);
    font-size: 16px;
    padding: 12px 10px;
    border: 2px solid var(--ink);
    border-radius: 4px;
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    text-align: center;
  }
  .rate-btn.active {
    background: var(--tape);
    border-color: var(--tape);
    color: var(--ink);
  }
  .rate-btn small { display: block; font-size: 12px; opacity: 0.75; margin-top: 2px; }
  .rate-btn.floor { position: relative; }
  .floor-input-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }
  .floor-input-row span { font-size: 16px; }
  .floor-input {
    width: 36px;
    font-family: var(--mono);
    font-size: 16px;
    text-align: center;
    border: none;
    border-bottom: 1px dashed currentColor;
    background: transparent;
    color: inherit;
    padding: 0 0 1px;
  }
  .floor-input:focus { outline: none; }
  /* remove number input spinners */
  .floor-input::-webkit-outer-spin-button,
  .floor-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .floor-input[type=number] { -moz-appearance: textfield; }

  .session {
    border: 1px solid var(--line);
    border-left: 4px solid var(--tape);
    border-radius: 3px;
    padding: 14px 16px;
    margin-bottom: 12px;
    background: #fff;
  }
  .session-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .session-head input.label-input {
    font-family: var(--mono);
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border: none;
    background: transparent;
    font-weight: bold;
    width: 65%;
    padding: 2px 0;
    border-bottom: 1px dashed transparent;
  }
  .session-head input.label-input:focus {
    outline: none;
    border-bottom: 1px dashed var(--tape);
  }
  .remove-btn {
    font-family: var(--mono);
    font-size: 13px;
    color: #a3392f;
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
  }
  .tag-row {
    margin-bottom: 10px;
  }
  .tag-select {
    font-family: var(--mono);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 5px 8px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--paper);
    color: #8a8375;
    cursor: pointer;
    max-width: 100%;
  }
  .tag-select.tagged {
    border: 1px solid var(--tape);
    background: var(--tape-dim);
    color: var(--ink);
    font-weight: bold;
  }
  .date-actions-row {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }
  .session-date-field {
    flex: 0 1 170px;
    min-width: 170px;
  }
  .session-date-field label {
    display: block;
    font-family: var(--mono);
    font-size: 12px;
    color: #8a8375;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .session-date-field input[type="date"] {
    width: 100%;
    min-width: 0;
    box-sizing: border-box;
    font-family: var(--mono);
    font-size: 15px;
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--paper);
  }
  .session-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    flex: 0 0 auto;
  }

  @media (max-width: 480px) {
    .date-actions-row {
      flex-direction: column;
      align-items: stretch;
    }
    .session-date-field {
      flex: 1 1 auto;
      width: 100%;
    }
    .session-actions {
      justify-content: flex-end;
      width: 100%;
    }
    .invoice-meta-row {
      flex-direction: column;
    }
  }

  .time-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-wrap: wrap;
  }
  .time-field { flex: 1; min-width: 110px; }
  .time-field label {
    display: block;
    font-family: var(--mono);
    font-size: 12px;
    color: #8a8375;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .time-field input[type="time"] {
    width: 100%;
    font-family: var(--mono);
    font-size: 16px;
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--paper);
  }
  .session-result {
    font-family: var(--mono);
    font-size: 14px;
    color: #6b655a;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px dashed var(--line);
  }
  .session-result strong { color: var(--ink); }
  .session-result .break-line { color: #b5761f; }

  .notes-row { margin-top: 10px; }
  .notes-row label {
    display: block;
    font-family: var(--mono);
    font-size: 12px;
    color: #8a8375;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .notes-row textarea {
    width: 100%;
    font-family: var(--serif);
    font-size: 15px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--paper);
    resize: vertical;
    min-height: 40px;
  }

  .punch-btn {
    font-family: var(--mono);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 9px 12px;
    border: 2px solid var(--ink);
    border-radius: 4px;
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
  }
  .punch-btn.running {
    background: var(--tape);
    border-color: var(--tape);
    color: var(--ink);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }
  .punch-live {
    font-family: var(--mono);
    font-size: 15px;
    color: #6b70c9;
    font-weight: bold;
  }
  .clear-btn {
    font-family: var(--mono);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 9px 10px;
    border: 2px solid transparent;
    border-radius: 4px;
    background: none;
    color: #a3392f;
    cursor: pointer;
  }
  .clear-btn:hover {
    border-color: #a3392f;
  }
  .break-btn {
    font-family: var(--mono);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 9px 10px;
    border: 2px solid var(--ink);
    border-radius: 4px;
    background: none;
    color: var(--ink);
    cursor: pointer;
  }
  .break-btn.on-break {
    background: #e8a33d;
    border-color: #e8a33d;
    color: var(--ink);
  }
  .break-live {
    font-family: var(--mono);
    font-size: 15px;
    color: #b8791f;
    font-weight: bold;
  }

  .add-btn {
    width: 100%;
    font-family: var(--mono);
    font-size: 15px;
    padding: 14px;
    border: 2px dashed var(--line);
    border-radius: 4px;
    background: none;
    color: #6b655a;
    cursor: pointer;
    margin-bottom: 24px;
  }
  .add-btn:hover { border-color: var(--tape); color: var(--tape); }

  .project-tally {
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 14px 16px;
    margin-bottom: 16px;
    background: #fff;
  }
  .project-tally-row {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 14px;
    padding: 5px 0;
    color: var(--ink);
  }
  .total-card {
    border: 2px solid var(--ink);
    border-radius: 4px;
    padding: 20px;
    background: var(--ink);
    color: var(--paper);
  }
  .total-row {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 15px;
    padding: 5px 0;
    color: #cfc9bc;
  }
  .total-row.final {
    border-top: 1px solid #4a463e;
    margin-top: 8px;
    padding-top: 12px;
    font-size: 26px;
    color: #fff;
    font-weight: bold;
  }
  .total-row.final span:last-child { color: var(--tape); }
  .rounding-note {
    font-family: var(--mono);
    font-size: 12px;
    color: #8a8375;
    margin-top: 18px;
    line-height: 1.6;
  }

  .split-invoice-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 12px;
    color: #6b655a;
    margin-bottom: 14px;
    cursor: pointer;
  }
  .split-invoice-row input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--tape);
    flex-shrink: 0;
  }
  .export-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 14px;
  }
  .export-btn {
    flex: 1;
    min-width: 100px;
    font-family: var(--mono);
    font-size: 15px;
    letter-spacing: 0.5px;
    padding: 12px;
    border: 2px solid var(--tape);
    border-radius: 4px;
    background: var(--tape);
    color: var(--ink);
    cursor: pointer;
    text-transform: uppercase;
  }
  .export-btn.secondary {
    background: var(--ink);
    border-color: var(--ink);
    color: #fff;
  }
  .export-btn:hover { background: #8f96f2; border-color: #8f96f2; }
  .export-btn.secondary:hover { background: #34302a; border-color: #34302a; }
  .export-btn.copied { background: #4a463e; border-color: #4a463e; color: #fff; }

  .history-toggle {
    width: 100%;
    font-family: var(--mono);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 10px;
    border: none;
    background: none;
    color: #6b655a;
    cursor: pointer;
    text-align: center;
    margin-top: 6px;
  }
  .history-toggle:hover { color: var(--ink); }
  .history-list {
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #fff;
    margin-top: 6px;
    max-height: 260px;
    overflow-y: auto;
  }
  .history-item {
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .history-item:last-child { border-bottom: none; }
  .history-item .hi-left { color: #6b655a; }
  .history-item .hi-left strong { color: var(--ink); display: block; font-size: 14px; margin-bottom: 2px; }
  .history-item .hi-right { text-align: right; white-space: nowrap; font-weight: bold; color: var(--ink); }
  .history-empty {
    padding: 16px 12px;
    font-family: var(--mono);
    font-size: 13px;
    color: #8a8375;
    text-align: center;
  }
  .history-clear {
    display: block;
    width: 100%;
    text-align: center;
    font-family: var(--mono);
    font-size: 12px;
    text-transform: uppercase;
    color: #a3392f;
    background: none;
    border: none;
    padding: 10px;
    cursor: pointer;
    text-decoration: underline;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script type="text/babel">
const { useState, useMemo, useEffect } = React;

function round(hours) {
  // 0-15 min down, 16-45 nearest half, 46-60 up
  const wholeHours = Math.floor(hours);
  const minutes = (hours - wholeHours) * 60;
  let add;
  if (minutes <= 15) add = 0;
  else if (minutes <= 45) add = 0.5;
  else add = 1;
  return wholeHours + add;
}

function diffHours(start, end) {
  if (!start || !end) return 0;
  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  let mins = (eh * 60 + em) - (sh * 60 + sm);
  if (mins < 0) mins += 24 * 60;
  return mins / 60;
}

function fmtHours(h) {
  const whole = Math.floor(h);
  const frac = h - whole;
  if (frac === 0) return `${whole} hr`;
  if (frac === 0.5) return `${whole}.5 hr`;
  return `${h.toFixed(2)} hr`;
}

function nowTimeStr() {
  const d = new Date();
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  return `${hh}:${mm}`;
}

function timeStrFromTimestamp(ts) {
  const d = new Date(ts);
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  return `${hh}:${mm}`;
}

function fmtElapsed(ms) {
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const pad = n => String(n).padStart(2, '0');
  return `${pad(h)}:${pad(m)}:${pad(s)}`;
}

function fmt12Hour(time24) {
  if (!time24) return '';
  const [h, m] = time24.split(':').map(Number);
  const period = h >= 12 ? 'PM' : 'AM';
  let h12 = h % 12;
  if (h12 === 0) h12 = 12;
  return `${h12}:${String(m).padStart(2, '0')} ${period}`;
}

function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}

function fmtExportTitle(dateStr, invoiceNumber, projectTitle) {
  const d = dateStr ? new Date(dateStr + 'T00:00:00') : new Date();
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  const projectSegment = (projectTitle || 'Untitled')
    .trim()
    .replace(/[^a-zA-Z0-9]+/g, '')
    .slice(0, 40) || 'Untitled';
  return `${year}${month}${day}_INV${invoiceNumber}_DJ_${projectSegment}`;
}

function parseTime12(str) {
  const m = str.trim().match(/^(\d{1,2}):(\d{2})\s*([AP]M)$/i);
  if (!m) return '';
  let h = parseInt(m[1], 10);
  const min = m[2];
  const period = m[3].toUpperCase();
  if (period === 'PM' && h !== 12) h += 12;
  if (period === 'AM' && h === 12) h = 0;
  return `${String(h).padStart(2, '0')}:${min}`;
}

function splitLabelTag(rawLabel) {
  const m = rawLabel.match(/^(.*) \[(.+)\]$/);
  if (m) return { label: m[1].trim(), tag: m[2].trim() };
  return { label: rawLabel.trim(), tag: '' };
}

function parseSummaryText(text) {
  const lines = text.replace(/\r\n/g, '\n').split('\n').map(l => l.replace(/\s+$/, ''));
  let idx = 0;
  const nextNonBlank = () => {
    while (idx < lines.length && lines[idx].trim() === '') idx++;
    return idx < lines.length ? lines[idx] : null;
  };

  const titleLineRaw = nextNonBlank();
  if (titleLineRaw === null) return { error: 'Could not find a project title line — make sure you pasted the full summary.' };
  const projectTitle = titleLineRaw.trim() === 'Untitled Project' ? '' : titleLineRaw.trim();
  idx++;

  const invLineRaw = nextNonBlank();
  if (invLineRaw === null) return { error: 'Could not find the invoice ID line (expected something like "20260810_INV1011_DJ_SarahPromo").' };
  const invMatch = invLineRaw.trim().match(/^(\d{4})(\d{2})(\d{2})_INV(\d+)_DJ_.+$/);
  if (!invMatch) return { error: 'Second line didn\'t match the expected "YYYYMMDD_INV#_DJ_ProjectName" format.' };
  const [, yyyy, mm, dd, invNumStr] = invMatch;
  const projectDate = `${yyyy}-${mm}-${dd}`;
  const invoiceNumber = Number(invNumStr);
  idx++;

  const sessions = [];
  let rate = null;
  let lastSession = null;

  const sessionTimeRe = /^(.+?) \((.+?)\): (.+?)–(.+?) → .+$/;
  const sessionNoTimeRe = /^(.+?): \(no time logged\)$/;
  const breakRe = /^\s+break:\s*(.+?)–(.+)$/;
  const noteRe = /^\s+note:\s*(.+)$/;
  const totalRe = /^Total:.*@\s*\$([\d.]+)\/hr\s*=/;

  for (; idx < lines.length; idx++) {
    const line = lines[idx];
    if (line.trim() === '') continue;

    const totalMatch = line.match(totalRe);
    if (totalMatch) {
      rate = Number(totalMatch[1]);
      continue;
    }

    const noteMatch = line.match(noteRe);
    if (noteMatch && lastSession) {
      lastSession.notes = noteMatch[1].trim();
      continue;
    }

    const breakMatch = line.match(breakRe);
    if (breakMatch && lastSession) {
      const bStart = parseTime12(breakMatch[1]);
      const bEnd = parseTime12(breakMatch[2]);
      if (bStart && bEnd) lastSession.breaks.push({ start: bStart, end: bEnd });
      continue;
    }

    const timeMatch = line.match(sessionTimeRe);
    if (timeMatch) {
      const [, rawLabel, dateStr, startStr, endStr] = timeMatch;
      const { label, tag } = splitLabelTag(rawLabel);
      const sess = {
        label,
        date: dateStr.trim() === 'no date' ? '' : dateStr.trim(),
        start: parseTime12(startStr),
        end: parseTime12(endStr),
        notes: '',
        breaks: [],
        tag,
      };
      sessions.push(sess);
      lastSession = sess;
      continue;
    }

    const noTimeMatch = line.match(sessionNoTimeRe);
    if (noTimeMatch) {
      const { label, tag } = splitLabelTag(noTimeMatch[1]);
      const sess = { label, date: '', start: '', end: '', notes: '', breaks: [], tag };
      sessions.push(sess);
      lastSession = sess;
      continue;
    }
    // unrecognized line — skip it rather than failing the whole import
  }

  if (sessions.length === 0) {
    return { error: 'No session lines were recognized — make sure you pasted the full "copy summary" text.' };
  }

  return { projectTitle, projectDate, invoiceNumber, rate, sessions };
}

function loadSavedFormState() {
  try {
    const raw = localStorage.getItem('shootTrackerFormState');
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== 'object') return null;
    return parsed;
  } catch (e) {
    return null;
  }
}

function App() {
  const saved = loadSavedFormState();
  const [projectTitle, setProjectTitle] = useState(() => (saved && typeof saved.projectTitle === 'string') ? saved.projectTitle : '');
  const [projectDate, setProjectDate] = useState(() => (saved && saved.projectDate) ? saved.projectDate : todayStr());
  const [billedTo, setBilledTo] = useState(() => (saved && typeof saved.billedTo === 'string') ? saved.billedTo : '');
  const [invoiceNumber, setInvoiceNumber] = useState(() => {
    try {
      const stored = localStorage.getItem('shootTrackerNextInvoiceNumber');
      return stored ? Number(stored) : 1011;
    } catch (e) {
      return 1011;
    }
  });
  const [exportHistory, setExportHistory] = useState(() => {
    try {
      const stored = localStorage.getItem('shootTrackerExportHistory');
      return stored ? JSON.parse(stored) : [];
    } catch (e) {
      return [];
    }
  });
  const [showHistory, setShowHistory] = useState(false);
  const [rate, setRate] = useState(() => (saved && typeof saved.rate === 'number') ? saved.rate : 50);
  const [floorRate, setFloorRate] = useState(() => (saved && typeof saved.floorRate === 'number') ? saved.floorRate : 40);
  const [sessions, setSessions] = useState(() => (saved && Array.isArray(saved.sessions) && saved.sessions.length > 0) ? saved.sessions : [
    { id: 1, label: 'Shoot', start: '', end: '', date: todayStr(), notes: '', onBreak: false, breakStart: null, breaks: [], tag: '' },
    { id: 2, label: 'Edit — session 1', start: '', end: '', date: todayStr(), notes: '', onBreak: false, breakStart: null, breaks: [], tag: '' },
  ]);
  const [nextId, setNextId] = useState(() => (saved && typeof saved.nextId === 'number') ? saved.nextId : 3);
  const [projectTags, setProjectTags] = useState(() => (saved && Array.isArray(saved.projectTags)) ? saved.projectTags : []);
  const [splitInvoiceByProject, setSplitInvoiceByProject] = useState(false);
  const [copied, setCopied] = useState(false);
  const [now, setNow] = useState(Date.now());
  const [showImport, setShowImport] = useState(false);
  const [pasteText, setPasteText] = useState('');
  const [importMsg, setImportMsg] = useState(null);

  const anyRunning = sessions.some(s => s.runningSince);

  useEffect(() => {
    if (!anyRunning) return;
    const interval = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(interval);
  }, [anyRunning]);

  useEffect(() => {
    try {
      const toSave = { projectTitle, projectDate, billedTo, rate, floorRate, sessions, nextId, projectTags };
      localStorage.setItem('shootTrackerFormState', JSON.stringify(toSave));
    } catch (e) {
      // storage unavailable or full — fail silently, nothing to recover here
    }
  }, [projectTitle, projectDate, billedTo, rate, floorRate, sessions, nextId, projectTags]);

  const handlePunch = (id) => {
    setSessions(prev => prev.map(s => {
      if (s.id !== id) return s;
      if (s.runningSince) {
        // punching out — close out any active break first, recording its time range
        let breaks = s.breaks || [];
        if (s.onBreak && s.breakStart) {
          breaks = [...breaks, { start: timeStrFromTimestamp(s.breakStart), end: nowTimeStr() }];
        }
        return { ...s, end: nowTimeStr(), runningSince: null, onBreak: false, breakStart: null, breaks };
      }
      // punching in
      return { ...s, start: nowTimeStr(), end: '', runningSince: Date.now(), date: todayStr(), onBreak: false, breakStart: null, breaks: [], tag: '' };
    }));
  };

  const handleBreak = (id) => {
    setSessions(prev => prev.map(s => {
      if (s.id !== id || !s.runningSince) return s;
      if (s.onBreak) {
        // resume — record this break as a completed time range
        const breakEnd = nowTimeStr();
        const breakStart = s.breakStart ? timeStrFromTimestamp(s.breakStart) : breakEnd;
        return { ...s, onBreak: false, breakStart: null, breaks: [...(s.breaks || []), { start: breakStart, end: breakEnd }] };
      }
      // start break
      return { ...s, onBreak: true, breakStart: Date.now() };
    }));
  };

  const handleClear = (id) => {
    setSessions(prev => prev.map(s => s.id === id
      ? { ...s, start: '', end: '', runningSince: null, onBreak: false, breakStart: null, breaks: [] }
      : s
    ));
  };

  const updateSession = (id, field, value) => {
    setSessions(prev => prev.map(s => s.id === id ? { ...s, [field]: value } : s));
  };

  const handleAssignTag = (sessionId, value) => {
    if (value === '__new__') {
      const name = window.prompt('Name this project:');
      if (!name || !name.trim()) return;
      const trimmed = name.trim();
      setProjectTags(prev => prev.includes(trimmed) ? prev : [...prev, trimmed]);
      updateSession(sessionId, 'tag', trimmed);
      return;
    }
    updateSession(sessionId, 'tag', value);
  };

  const addSession = () => {
    setSessions(prev => [...prev, { id: nextId, label: `Edit — session ${prev.length}`, start: '', end: '', runningSince: null, date: todayStr(), notes: '', onBreak: false, breakStart: null, breaks: [], tag: '' }]);
    setNextId(n => n + 1);
  };

  const removeSession = (id) => {
    setSessions(prev => prev.filter(s => s.id !== id));
  };

  const computed = useMemo(() => {
    return sessions.map(s => {
      const fullShiftRaw = diffHours(s.start, s.end);
      const breakHours = (s.breaks || []).reduce((sum, b) => sum + diffHours(b.start, b.end), 0);
      const raw = Math.max(0, fullShiftRaw - breakHours);
      const rounded = raw > 0 ? round(raw) : 0;
      return { ...s, fullShiftRaw, breakHours, raw, rounded };
    });
  }, [sessions]);

  const totalRounded = computed.reduce((sum, s) => sum + s.rounded, 0);
  const totalCost = totalRounded * rate;

  const byProjectTally = useMemo(() => {
    const groups = {};
    computed.forEach(s => {
      if (s.raw <= 0) return;
      const key = s.tag || '';
      if (!groups[key]) groups[key] = 0;
      groups[key] += s.raw;
    });
    const order = [...projectTags, ''];
    return order
      .filter(key => groups[key] !== undefined)
      .map(key => {
        const rawTotal = groups[key];
        const rounded = round(rawTotal);
        return {
          tag: key || 'Untagged',
          rawTotal,
          rounded,
          cost: rounded * rate,
        };
      });
  }, [computed, projectTags, rate]);

  const buildSummary = () => {
    const lines = [];
    lines.push(projectTitle ? projectTitle : 'Untitled Project');
    lines.push(fmtExportTitle(projectDate, invoiceNumber, projectTitle));
    lines.push('');
    computed.forEach(s => {
      const labelWithTag = s.tag ? `${s.label} [${s.tag}]` : s.label;
      if (s.raw > 0) {
        lines.push(`${labelWithTag} (${s.date || 'no date'}): ${fmt12Hour(s.start)}–${fmt12Hour(s.end)} → ${fmtHours(s.rounded)}`);
        (s.breaks || []).forEach(b => {
          lines.push(`   break: ${fmt12Hour(b.start)}–${fmt12Hour(b.end)}`);
        });
        if (s.notes) lines.push(`   note: ${s.notes}`);
      } else {
        lines.push(`${labelWithTag}: (no time logged)`);
      }
    });
    if (byProjectTally.some(g => g.tag !== 'Untagged')) {
      lines.push('');
      lines.push('By Project:');
      byProjectTally.forEach(g => {
        lines.push(`   ${g.tag}: ${fmtHours(g.rounded)} @ $${rate}/hr = $${g.cost.toFixed(0)}`);
      });
    }
    lines.push('');
    lines.push(`Total: ${fmtHours(totalRounded)} @ $${rate}/hr = $${totalCost.toFixed(0)}`);
    return lines.join('\n');
  };

  const handleExport = async () => {
    const text = buildSummary();
    try {
      await navigator.clipboard.writeText(text);
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch (e) {
      // fallback: select-and-copy not available, just show the text
      window.prompt('Copy this summary:', text);
    }
  };

  const handleImport = () => {
    const result = parseSummaryText(pasteText);
    if (result.error) {
      setImportMsg({ type: 'error', text: result.error });
      return;
    }

    const hasExistingData = projectTitle || billedTo || sessions.some(s => s.start || s.end || s.notes);
    if (hasExistingData) {
      const ok = window.confirm(
        `Import this timecard?\n\nThis will replace your current project details and sessions below with ${result.sessions.length} imported session(s).`
      );
      if (!ok) return;
    }

    setProjectTitle(result.projectTitle);
    setProjectDate(result.projectDate || todayStr());

    if (result.rate != null) {
      if (result.rate === 50) {
        setRate(50);
      } else {
        setFloorRate(result.rate);
        setRate(result.rate);
      }
    }

    const newSessions = result.sessions.map((s, i) => ({
      id: nextId + i,
      label: s.label,
      start: s.start,
      end: s.end,
      date: s.date,
      notes: s.notes,
      runningSince: null,
      onBreak: false,
      breakStart: null,
      breaks: s.breaks || [],
      tag: s.tag || '',
    }));
    setSessions(newSessions);
    setNextId(id => id + result.sessions.length);

    const importedTags = [...new Set(newSessions.map(s => s.tag).filter(Boolean))];
    if (importedTags.length > 0) {
      setProjectTags(prev => [...new Set([...prev, ...importedTags])]);
    }

    if (result.invoiceNumber && result.invoiceNumber !== invoiceNumber) {
      const setInv = window.confirm(
        `This timecard was originally Invoice #${result.invoiceNumber}. Your current next-invoice number is #${invoiceNumber}.\n\n` +
        `Set the invoice number back to #${result.invoiceNumber}?`
      );
      if (setInv) {
        setInvoiceNumber(result.invoiceNumber);
        try { localStorage.setItem('shootTrackerNextInvoiceNumber', String(result.invoiceNumber)); } catch (e) { /* ignore */ }
      }
    }

    setImportMsg({ type: 'success', text: `Imported ${result.sessions.length} session(s).` });
    setPasteText('');
    setShowImport(false);
  };

  const escapeHTML = (val) => String(val)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  const buildStyledExcel = () => {
    const accent = '#ABB1FF';
    const ink = '#1c1a17';
    const rowsHTML = computed.map(s => {
      const breakText = (s.breaks || []).map(b => `${fmt12Hour(b.start)}–${fmt12Hour(b.end)}`).join('; ');
      return `
      <tr>
        <td>${escapeHTML(s.label)}</td>
        <td>${escapeHTML(s.tag || '')}</td>
        <td>${escapeHTML(s.date || '')}</td>
        <td>${escapeHTML(s.start ? fmt12Hour(s.start) : '')}</td>
        <td>${escapeHTML(s.end ? fmt12Hour(s.end) : '')}</td>
        <td style="color:#b5761f;">${escapeHTML(breakText)}</td>
        <td align="right">${s.raw > 0 ? s.rounded : ''}</td>
        <td style="color:#6b655a;font-style:italic;">${escapeHTML(s.notes || '')}</td>
      </tr>`;
    }).join('');

    const hasProjectTags = byProjectTally.some(g => g.tag !== 'Untagged');
    const byProjectHTML = hasProjectTags ? `
          <tr><td colspan="8"></td></tr>
          <tr style="font-weight:bold;"><td colspan="8">By Project</td></tr>
          ${byProjectTally.map(g => `
          <tr>
            <td colspan="5">${escapeHTML(g.tag)}</td>
            <td align="right">${g.rounded}</td>
            <td></td>
            <td align="right">$${g.cost.toFixed(0)}</td>
          </tr>`).join('')}` : '';

    return `
      <html>
      <head><meta charset="UTF-8"></head>
      <body style="font-family:Calibri, Arial, sans-serif;">
        <table border="0" cellspacing="0" cellpadding="6">
          <tr><td style="font-size:16px;font-weight:bold;color:${ink};" colspan="8">${escapeHTML(projectTitle || 'Untitled Project')}</td></tr>
          <tr><td style="font-weight:bold;">Invoice #</td><td colspan="7">${escapeHTML(invoiceNumber)}</td></tr>
          <tr><td style="font-weight:bold;">Billed To</td><td colspan="7">${escapeHTML(billedTo || '')}</td></tr>
          <tr><td style="font-weight:bold;">Invoice Date</td><td colspan="7">${escapeHTML(projectDate || todayStr())}</td></tr>
          <tr><td colspan="8"></td></tr>
          <tr style="background:${accent};color:${ink};font-weight:bold;">
            <td>Session</td><td>Project</td><td>Date Worked</td><td>Start</td><td>End</td><td>Break</td><td align="right">Rounded Hours</td><td>Notes</td>
          </tr>
          ${rowsHTML}
          ${byProjectHTML}
          <tr><td colspan="8"></td></tr>
          <tr style="font-weight:bold;">
            <td colspan="6">TOTAL</td>
            <td align="right">${totalRounded}</td>
            <td></td>
          </tr>
          <tr><td colspan="6">Rate</td><td align="right">$${rate}/hr</td><td></td></tr>
          <tr style="background:${accent};color:${ink};font-weight:bold;font-size:14px;">
            <td colspan="6">TOTAL COST</td><td align="right">$${totalCost.toFixed(0)}</td><td></td>
          </tr>
        </table>
      </body>
      </html>`;
  };

  const logExport = (entry) => {
    setExportHistory(prev => {
      const updated = [{ ...entry, loggedAt: Date.now() }, ...prev].slice(0, 100);
      try {
        localStorage.setItem('shootTrackerExportHistory', JSON.stringify(updated));
      } catch (e) { /* ignore */ }
      return updated;
    });
  };

  const handleExportExcel = () => {
    const html = buildStyledExcel();
    const blob = new Blob(['\ufeff' + html], { type: 'application/vnd.ms-excel' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${fmtExportTitle(projectDate, invoiceNumber, projectTitle)}.xls`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    logExport({
      type: 'Excel',
      project: projectTitle || 'Untitled Project',
      date: projectDate || todayStr(),
      hours: totalRounded,
      rate,
      total: totalCost,
    });
  };

  const handleDownloadInvoicePDF = () => {
    const alreadyUsed = exportHistory.some(
      h => h.type === 'PDF Invoice' && Number(h.invoiceNum) === Number(invoiceNumber)
    );

    if (alreadyUsed) {
      const proceedAnyway = window.confirm(
        `Heads up — Invoice #${invoiceNumber} was already used for a previous PDF export.\n\n` +
        `Click OK to re-download it anyway (same number), or Cancel to fix the invoice number first.`
      );
      if (!proceedAnyway) return;
    } else {
      const confirmed = window.confirm(
        `Generate PDF for Invoice #${invoiceNumber}?\n\n` +
        `After this download, the invoice number will move to #${invoiceNumber + 1} for next time.`
      );
      if (!confirmed) return;
    }

    const nextNum = invoiceNumber + 1;
    const finalize = () => {
      try {
        localStorage.setItem('shootTrackerNextInvoiceNumber', String(nextNum));
      } catch (e) { /* ignore */ }
      setInvoiceNumber(nextNum);
    };

    if (!window.jspdf) {
      window.alert('PDF library did not load — check your connection and try again.');
      return;
    }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'pt', format: 'letter' });
    const accent = [171, 177, 255];
    const ink = [28, 26, 23];
    const gray = [107, 101, 90];
    const margin = 40;

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(24);
    doc.setTextColor(...ink);
    doc.text('INVOICE', margin, 55);
    doc.setDrawColor(...accent);
    doc.setLineWidth(2.5);
    doc.line(margin, 65, doc.internal.pageSize.getWidth() - margin, 65);

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10);
    doc.setTextColor(...gray);
    const rightX = doc.internal.pageSize.getWidth() - margin;
    doc.text(`Invoice #: ${invoiceNumber}`, rightX, 30, { align: 'right' });
    doc.text(`Date: ${projectDate || todayStr()}`, rightX, 43, { align: 'right' });
    doc.text(`Project: ${projectTitle || 'Untitled Project'}`, rightX, 56, { align: 'right' });

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(12);
    doc.setTextColor(...ink);
    doc.text('Deanna Jackson', margin, 90);

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10);
    doc.setTextColor(...gray);
    doc.text('Billed To', margin, 112);
    doc.setTextColor(...ink);
    doc.setFontSize(11);
    doc.text(billedTo || '—', margin, 126);

    const useSplit = splitInvoiceByProject && byProjectTally.some(g => g.tag !== 'Untagged');
    const tableRows = [];

    if (useSplit) {
      const groupOrder = [...projectTags, ''];
      groupOrder.forEach(tagKey => {
        const groupSessions = computed.filter(s => s.raw > 0 && (s.tag || '') === tagKey);
        if (groupSessions.length === 0) return;
        const displayName = tagKey || 'Other';
        tableRows.push([{ content: displayName, colSpan: 6, styles: { fillColor: accent, textColor: ink, fontStyle: 'bold' } }]);
        groupSessions.forEach(s => {
          tableRows.push([
            s.date || '',
            s.label,
            s.notes || '',
            fmtHours(s.rounded),
            `$${rate}/hr`,
            `$${(s.rounded * rate).toFixed(0)}`,
          ]);
        });
        const groupTally = byProjectTally.find(g => g.tag === displayName || (tagKey === '' && g.tag === 'Untagged'));
        const subtotalHours = groupTally ? groupTally.rounded : 0;
        const subtotalCost = groupTally ? groupTally.cost : 0;
        tableRows.push([
          { content: `Subtotal — ${displayName}`, colSpan: 3, styles: { fontStyle: 'bold' } },
          { content: fmtHours(subtotalHours), styles: { fontStyle: 'bold' } },
          '',
          { content: `$${subtotalCost.toFixed(0)}`, styles: { fontStyle: 'bold' } },
        ]);
      });
    } else {
      computed.filter(s => s.raw > 0).forEach(s => {
        tableRows.push([
          s.date || '',
          s.label,
          s.notes || '',
          fmtHours(s.rounded),
          `$${rate}/hr`,
          `$${(s.rounded * rate).toFixed(0)}`,
        ]);
      });
    }

    doc.autoTable({
      startY: 145,
      margin: { left: margin, right: margin },
      head: [['Date Worked', 'Description', 'Notes', 'Hours', 'Rate', 'Amount']],
      body: tableRows,
      styles: { font: 'helvetica', fontSize: 10, cellPadding: 6 },
      headStyles: { fillColor: accent, textColor: ink, fontStyle: 'bold', fontSize: 9 },
      bodyStyles: { textColor: ink },
      alternateRowStyles: { fillColor: [247, 244, 238] },
      columnStyles: { 2: { textColor: gray, fontStyle: 'italic' } },
    });

    const footerHours = useSplit ? byProjectTally.reduce((sum, g) => sum + g.rounded, 0) : totalRounded;
    const footerCost = useSplit ? byProjectTally.reduce((sum, g) => sum + g.cost, 0) : totalCost;

    const finalY = doc.lastAutoTable.finalY + 20;
    const boxX = doc.internal.pageSize.getWidth() - margin - 200;

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(11);
    doc.setTextColor(...ink);
    doc.text('Total Hours', boxX, finalY);
    doc.text(fmtHours(footerHours), rightX, finalY, { align: 'right' });
    doc.text('Rate', boxX, finalY + 16);
    doc.text(`$${rate}/hr`, rightX, finalY + 16, { align: 'right' });

    doc.setDrawColor(...ink);
    doc.setLineWidth(1);
    doc.line(boxX, finalY + 26, rightX, finalY + 26);

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(15);
    doc.text('Total Due', boxX, finalY + 44);
    doc.text(`$${footerCost.toFixed(0)}`, rightX, finalY + 44, { align: 'right' });

    doc.save(`${fmtExportTitle(projectDate, invoiceNumber, projectTitle)}.pdf`);
    logExport({
      type: 'PDF Invoice',
      project: projectTitle || 'Untitled Project',
      date: projectDate || todayStr(),
      invoiceNum: invoiceNumber,
      hours: footerHours,
      rate,
      total: footerCost,
    });
    finalize();
  };

  const handleStartNewTimecard = () => {
    const ok = window.confirm(
      'Start a new timecard?\n\nThis clears the project info and all sessions below (does not affect your invoice number or export history).'
    );
    if (!ok) return;
    setProjectTitle('');
    setProjectDate(todayStr());
    setBilledTo('');
    setRate(50);
    setFloorRate(40);
    setSessions([
      { id: 1, label: 'Shoot', start: '', end: '', date: todayStr(), notes: '', onBreak: false, breakStart: null, breaks: [], tag: '' },
      { id: 2, label: 'Edit — session 1', start: '', end: '', date: todayStr(), notes: '', onBreak: false, breakStart: null, breaks: [], tag: '' },
    ]);
    setNextId(3);
    setProjectTags([]);
    setSplitInvoiceByProject(false);
    try { localStorage.removeItem('shootTrackerFormState'); } catch (e) { /* ignore */ }
  };

  return (
    <div>
      <div className="slate">
        <div className="slate-top"></div>
        <h1>Shoot & Edit Log</h1>
        <p>Track sessions below — hours round to the nearest half hour, then multiply by your rate.</p>
      </div>

      <div className="toolbar-row">
        <button className="import-toggle" onClick={() => { setShowImport(v => !v); setImportMsg(null); }}>
          {showImport ? '▲ hide import' : '▼ import a past timecard'}
        </button>
        <button className="new-timecard-btn" onClick={handleStartNewTimecard}>start new timecard</button>
      </div>
      {showImport && (
        <div className="import-panel">
          <div className="import-hint">
            Paste the text from "copy summary" (from a previous export) below — it'll refill the project, date, rate, and sessions.
          </div>
          <textarea
            placeholder="Paste copied summary here..."
            value={pasteText}
            onChange={e => setPasteText(e.target.value)}
          />
          <div className="import-actions">
            <button className="import-btn" onClick={handleImport}>Import</button>
          </div>
          {importMsg && (
            <div className={`import-msg ${importMsg.type}`}>{importMsg.text}</div>
          )}
        </div>
      )}

      <div className="invoice-meta-row">
        <div className="project-field">
          <label>Invoice #</label>
          <input
            type="number"
            value={invoiceNumber}
            onChange={e => setInvoiceNumber(Number(e.target.value) || 0)}
          />
        </div>
        <div className="project-field">
          <label>Invoice Date</label>
          <input
            type="date"
            value={projectDate}
            onChange={e => setProjectDate(e.target.value)}
          />
        </div>
      </div>

      <div className="project-row">
        <div className="project-field">
          <label>Project</label>
          <input
            type="text"
            placeholder="e.g. Sarah — Instagram promo"
            value={projectTitle}
            onChange={e => setProjectTitle(e.target.value)}
          />
        </div>
        <div className="project-field">
          <label>Billed To</label>
          <input
            type="text"
            placeholder="e.g. Sarah Nguyen"
            value={billedTo}
            onChange={e => setBilledTo(e.target.value)}
          />
        </div>
      </div>

      <div className="rate-row">
        <button
          className={`rate-btn ${rate === 50 ? 'active' : ''}`}
          onClick={() => setRate(50)}
        >
          $50/hr<small>opening rate</small>
        </button>
        <button
          className={`rate-btn floor ${rate === floorRate ? 'active' : ''}`}
          onClick={() => setRate(floorRate)}
        >
          <div className="floor-input-row">
            <span>$</span>
            <input
              className="floor-input"
              type="number"
              min="1"
              value={floorRate}
              onClick={e => e.stopPropagation()}
              onChange={e => {
                const v = Number(e.target.value) || 0;
                setFloorRate(v);
                setRate(prev => (prev === floorRate ? v : prev));
              }}
            />
            <span>/hr</span>
          </div>
          <small>floor rate — click to edit</small>
        </button>
      </div>

      <hr className="section-hr" />
      <div className="section-label">Time Cards</div>

      {computed.map(s => (
        <div className="session" key={s.id}>
          <div className="session-head">
            <input
              className="label-input"
              value={s.label}
              onChange={e => updateSession(s.id, 'label', e.target.value)}
            />
            {sessions.length > 1 && (
              <button className="remove-btn" onClick={() => removeSession(s.id)}>remove</button>
            )}
          </div>
          <div className="tag-row">
            <select
              className={`tag-select ${s.tag ? 'tagged' : ''}`}
              value={s.tag || ''}
              onChange={e => handleAssignTag(s.id, e.target.value)}
            >
              <option value="">Untagged</option>
              {projectTags.map(t => (
                <option key={t} value={t}>{t}</option>
              ))}
              <option value="__new__">+ New project…</option>
            </select>
          </div>
          <div className="date-actions-row">
            <div className="session-date-field">
              <label>Date worked</label>
              <input
                type="date"
                value={s.date || ''}
                onChange={e => updateSession(s.id, 'date', e.target.value)}
              />
            </div>
            <div className="session-actions">
              <button
                className={`punch-btn ${s.runningSince ? 'running' : ''}`}
                onClick={() => handlePunch(s.id)}
              >
                {s.runningSince ? 'punch out' : 'punch in'}
              </button>
              {s.runningSince && (
                <button
                  className={`break-btn ${s.onBreak ? 'on-break' : ''}`}
                  onClick={() => handleBreak(s.id)}
                >
                  {s.onBreak ? 'resume' : 'break'}
                </button>
              )}
              <button className="clear-btn" onClick={() => handleClear(s.id)}>
                clear
              </button>
            </div>
          </div>
          {s.runningSince && !s.onBreak && (
            <div className="punch-live">
              {fmtElapsed(now - s.runningSince - ((s.breaks || []).reduce((sum, b) => sum + diffHours(b.start, b.end), 0) * 3600000))} elapsed
            </div>
          )}
          {s.runningSince && s.onBreak && (
            <div className="break-live">on break — {fmtElapsed(now - s.breakStart)}</div>
          )}
          <div className="time-row">
            <div className="time-field">
              <label>Start</label>
              <input type="time" value={s.start} onChange={e => updateSession(s.id, 'start', e.target.value)} />
            </div>
            <div className="time-field">
              <label>End</label>
              <input type="time" value={s.end} onChange={e => updateSession(s.id, 'end', e.target.value)} />
            </div>
          </div>
          {s.start && s.end && (
            <div className="session-result">
              {fmt12Hour(s.start)} – {fmt12Hour(s.end)}<br/>
              {(s.breaks || []).map((b, i) => (
                <React.Fragment key={i}>
                  <span className="break-line">− break: {fmt12Hour(b.start)} – {fmt12Hour(b.end)}</span><br/>
                </React.Fragment>
              ))}
              Raw: {s.raw.toFixed(2)} hr → Rounded: <strong>{fmtHours(s.rounded)}</strong>
            </div>
          )}
          <div className="notes-row">
            <label>Notes</label>
            <textarea
              placeholder="e.g. reshot intro, added lower thirds..."
              value={s.notes || ''}
              onChange={e => updateSession(s.id, 'notes', e.target.value)}
            />
          </div>
        </div>
      ))}

      <button className="add-btn" onClick={addSession}>+ add another session</button>

      {byProjectTally.some(g => g.tag !== 'Untagged') && (
        <div className="project-tally">
          <div className="section-label">By Project</div>
          {byProjectTally.map(g => (
            <div className="project-tally-row" key={g.tag}>
              <span>{g.tag}</span>
              <span>{fmtHours(g.rounded)} · ${g.cost.toFixed(0)}</span>
            </div>
          ))}
        </div>
      )}

      <div className="total-card">
        <div className="total-row">
          <span>Total rounded hours</span>
          <span>{fmtHours(totalRounded)}</span>
        </div>
        <div className="total-row">
          <span>Rate</span>
          <span>${rate}/hr</span>
        </div>
        <div className="total-row final">
          <span>Total</span>
          <span>${totalCost.toFixed(0)}</span>
        </div>
      </div>

      {byProjectTally.some(g => g.tag !== 'Untagged') && (
        <label className="split-invoice-row">
          <input
            type="checkbox"
            checked={splitInvoiceByProject}
            onChange={e => setSplitInvoiceByProject(e.target.checked)}
          />
          Split PDF invoice by project (subtotals grouped under each project)
        </label>
      )}

      <div className="export-row">
        <button className={`export-btn ${copied ? 'copied' : ''}`} onClick={handleExport}>
          {copied ? '✓ copied' : 'copy summary'}
        </button>
        <button className="export-btn secondary" onClick={handleExportExcel}>
          download excel
        </button>
        <button className="export-btn secondary" onClick={handleDownloadInvoicePDF}>
          download pdf invoice
        </button>
      </div>

      <button className="history-toggle" onClick={() => setShowHistory(v => !v)}>
        {showHistory ? '▲ hide export history' : `▼ export history (${exportHistory.length})`}
      </button>
      {showHistory && (
        <div className="history-list">
          {exportHistory.length === 0 ? (
            <div className="history-empty">No exports yet on this device.</div>
          ) : (
            exportHistory.map((h, i) => (
              <div className="history-item" key={i}>
                <div className="hi-left">
                  <strong>{h.project}{h.invoiceNum ? ` — #${h.invoiceNum}` : ''}</strong>
                  {h.type} · {h.date}
                </div>
                <div className="hi-right">
                  {fmtHours(h.hours)}<br/>${h.total.toFixed(0)}
                </div>
              </div>
            ))
          )}
        </div>
      )}
      {showHistory && exportHistory.length > 0 && (
        <button
          className="history-clear"
          onClick={() => {
            if (window.confirm('Clear all export history on this device?')) {
              setExportHistory([]);
              try { localStorage.removeItem('shootTrackerExportHistory'); } catch (e) { /* ignore */ }
            }
          }}
        >
          clear history
        </button>
      )}

      <div className="rounding-note">
        Rounding rule: 0–15 min down · 16–45 min → nearest half hour · 46–60 min up.<br/>
        "Punch in" grabs the current time as Start; "punch out" grabs it as End — or just type times manually.<br/>
        "Break" pauses the timer without ending the session; "resume" picks back up — break time is subtracted from your total automatically.<br/>
        "Clear" resets that session's start/end/break data if you need to redo a punch.<br/>
        Each session has its own "Date worked" and a Notes field for quick comments.<br/>
        Entries are editable any time — click into any field to change it.<br/>
        "Download Excel" opens directly in Excel, Numbers, or Google Sheets, with a styled header.<br/>
        "Download PDF Invoice" saves the invoice directly as a PDF — no print dialog needed.<br/>
        "Export history" remembers past exports on this device/browser only — not synced elsewhere.<br/>
        Your project, rate, and sessions auto-save on this device as you work, including a punch that's still running — closing or reloading the tab won't lose them.<br/>
        Use "start new timecard" when you're ready to clear everything and begin the next one.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
